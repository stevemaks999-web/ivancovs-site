name: Gatekeeper

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  gatekeeper:
    name: gatekeeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (basic patterns)
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.github -E \
            '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|define\( *.(DB_PASSWORD|AUTH_KEY|SECURE_AUTH_KEY).)' .; then
            echo "::error::Possible secret found in repository"; exit 1
          fi

      - name: Forbidden files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env|wp-config\.php|id_[a-z0-9]+)$|\.(sql|sql\.gz|pem|key)$' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden files: $bad"; exit 1; fi

      - name: PHP lint
        run: |
          files=$(git ls-files '*.php')
          [ -z "$files" ] && { echo "no PHP files"; exit 0; }
          echo "$files" | xargs -n1 php -l

  # Одобряет PR в main от владельца после зелёной проверки (один владелец, второго проверяющего нет).
  # Чужие PR и PR из форков не одобряются.
  auto-approve:
    name: auto-approve
    needs: gatekeeper
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --approve --body "Gatekeeper зелёный, автоодобрение."
